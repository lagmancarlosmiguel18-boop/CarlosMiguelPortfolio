<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Message — CMJL Portfolio</title>
</head>
<body style="margin:0;padding:0;background-color:#050510;font-family:'Segoe UI',Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
  style="background-color:#050510;padding:40px 16px;">
  <tr>
    <td align="center">
      <table width="540" cellpadding="0" cellspacing="0" border="0"
        style="max-width:540px;width:100%;background-color:#0c0c1e;border-radius:20px;
               overflow:hidden;border:1px solid rgba(130,90,255,0.25);">

        <!-- HEADER -->
        <tr>
          <td style="background:linear-gradient(135deg,#180a40 0%,#0c0c1e 100%);
                     padding:36px 36px 28px;text-align:center;
                     border-bottom:1px solid rgba(130,90,255,0.18);">
            <div style="font-size:36px;font-weight:800;color:#ffffff;
                        letter-spacing:8px;margin-bottom:10px;">CMJL</div>
            <div style="display:inline-block;background:rgba(34,197,94,0.12);
                        border:1px solid rgba(34,197,94,0.3);border-radius:20px;
                        padding:5px 16px;font-size:11px;color:#4ade80;
                        letter-spacing:3px;text-transform:uppercase;font-weight:600;">
              New Message Received
            </div>
          </td>
        </tr>

        <!-- BANNER -->
        <tr>
          <td style="padding:28px 36px 0;">
            <table width="100%" cellpadding="0" cellspacing="0" border="0"
              style="background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.2);
                     border-radius:12px;">
              <tr>
                <td style="padding:14px 20px;">
                  <span style="font-size:20px;margin-right:10px;">💬</span>
                  <span style="color:#d1fae5;font-size:14px;font-weight:600;">
                    Someone sent you a message through your portfolio!
                  </span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- SENDER INFO -->
        <tr>
          <td style="padding:24px 36px 0;">

            <!-- From -->
            <table width="100%" cellpadding="0" cellspacing="0" border="0"
              style="border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:14px;margin-bottom:14px;">
              <tr>
                <td width="28" valign="top" style="padding-top:2px;">
                  <span style="font-size:16px;">👤</span>
                </td>
                <td>
                  <div style="color:#6b6b8a;font-size:10px;font-weight:700;
                              letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;">
                    From
                  </div>
                  <div style="color:#e8e8ff;font-size:15px;font-weight:600;">{{from_name}}</div>
                </td>
              </tr>
            </table>

            <!-- Reply-to Email -->
            <table width="100%" cellpadding="0" cellspacing="0" border="0"
              style="border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:14px;margin-bottom:14px;">
              <tr>
                <td width="28" valign="top" style="padding-top:2px;">
                  <span style="font-size:16px;">📧</span>
                </td>
                <td>
                  <div style="color:#6b6b8a;font-size:10px;font-weight:700;
                              letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;">
                    Reply To
                  </div>
                  <div>
                    <a href="mailto:{{from_email}}" 
                      style="color:#8a5cf6;font-size:14px;font-weight:600;text-decoration:none;">
                      {{from_email}}
                    </a>
                  </div>
                </td>
              </tr>
            </table>

            <!-- Subject -->
            <table width="100%" cellpadding="0" cellspacing="0" border="0"
              style="border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:14px;margin-bottom:14px;">
              <tr>
                <td width="28" valign="top" style="padding-top:2px;">
                  <span style="font-size:16px;">📌</span>
                </td>
                <td>
                  <div style="color:#6b6b8a;font-size:10px;font-weight:700;
                              letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;">
                    Subject
                  </div>
                  <div style="color:#e8e8ff;font-size:14px;font-weight:600;">{{subject}}</div>
                </td>
              </tr>
            </table>

            <!-- Time -->
            <table width="100%" cellpadding="0" cellspacing="0" border="0"
              style="border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:14px;margin-bottom:20px;">
              <tr>
                <td width="28" valign="top" style="padding-top:2px;">
                  <span style="font-size:16px;">⏰</span>
                </td>
                <td>
                  <div style="color:#6b6b8a;font-size:10px;font-weight:700;
                              letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;">
                    Sent At (PH Time)
                  </div>
                  <div style="color:#e8e8ff;font-size:14px;font-weight:600;">{{sent_time}}</div>
                </td>
              </tr>
            </table>

            <!-- Message -->
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td>
                  <div style="color:#6b6b8a;font-size:10px;font-weight:700;
                              letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;">
                    💬 Message
                  </div>
                  <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);
                              border-radius:12px;padding:20px;color:#d0d0f0;font-size:14px;
                              line-height:1.8;white-space:pre-line;">{{message}}</div>
                </td>
              </tr>
            </table>

          </td>
        </tr>

        <!-- REPLY BUTTON -->
        <tr>
          <td style="padding:28px 36px 32px;text-align:center;">
            <a href="mailto:{{from_email}}" 
              style="display:inline-block;background:linear-gradient(135deg,#16a34a,#15803d);
                     color:#ffffff;font-size:13px;font-weight:700;letter-spacing:1px;
                     text-decoration:none;padding:13px 32px;border-radius:50px;
                     box-shadow:0 4px 24px rgba(22,163,74,0.4);">
              Reply to {{from_name}} →
            </a>
          </td>
        </tr>

        <!-- FOOTER -->
        <tr>
          <td style="background:rgba(139,92,246,0.04);padding:18px 36px;
                     border-top:1px solid rgba(139,92,246,0.1);text-align:center;">
            <p style="color:#3d3d5c;font-size:11px;margin:0;line-height:1.6;">
              Sent via the contact form on CMJL Portfolio<br>
              <a href="https://cmjl.netlify.app" target="_blank"
                style="color:#6b4fbb;text-decoration:none;">cmjl.netlify.app</a>
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
